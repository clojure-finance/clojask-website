{% extends "/html/base.html" %}
{% block subtitle %}Tagged &ldquo;{{name}}&rdquo; · {% endblock %}
{% block content %}
<div class="doc-grid">
    <article class="doc">
        <header class="doc-header"><h1>Tagged &ldquo;{{name}}&rdquo;</h1></header>
        <ul class="page-list">
            {% for post in posts %}
            <li><a href="{{post.uri}}">{{post.title}}</a></li>
            {% endfor %}
        </ul>
    </article>
</div>
{% endblock %}
