name: deploy

# Build the Cryogen site and publish it to the gh-pages branch, which GitHub
# Pages serves as https://clojure-finance.github.io/clojask-website/

on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "themes/**"
      - "src/**"
      - "project.clj"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.12.0
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Build
        run: lein run
      - name: Publish to gh-pages
        run: |
          out=public/clojask-website
          # the build also copies the Markdown sources next to the HTML
          rm -rf "$out/posts" "$out/pages"
          git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach site origin/gh-pages
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$out"/. site/
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged, nothing to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/gh-pages
